<style>

*{box-sizing:border-box}

input[type=file]{display:none}

.step{border-left:3px solid var(--line);padding:4px 10px;margin:6px 0}

.msg.ok{color:var(--new)}.msg.err{color:var(--err)}

input[type=text],textarea,select{font:inherit;width:100%;min-height:48px;border-radius:12px;border:2px solid var(--line);background:#2f2a26;color:var(--text);padding:8px 12px}
textarea{min-height:80px}
input.bad,textarea.bad{border-color:var(--err)}
.ferr{color:var(--err);font-size:14px;margin-top:2px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}

.photo{display:none;gap:12px;align-items:center;flex-wrap:wrap;margin-top:8px}
.photo.on{display:flex}
canvas.big{width:128px;height:128px;border-radius:50%}
ul{margin:4px 0;padding-left:20px}
main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
header.top{display:flex;align-items:center;gap:8px;margin:6px 0 12px}

.rows{border-radius:14px;overflow:hidden;display:flex;flex-direction:column;gap:1px;background:var(--line);margin:10px 0}
.srow{width:100%;text-align:left;min-height:64px;border:none;border-radius:0;background:var(--card);padding:10px 14px}
.st{display:block;font-weight:600}.ss{display:block;color:var(--text2);font-size:14px}
.chev{font-size:26px;color:var(--text2)}

.av img[src^="data:image/svg"]{object-fit:contain}

.wiz .spark{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.wiz .spark:nth-of-type(2n){animation-delay:.6s}.wiz .spark:nth-of-type(3n){animation-delay:1.2s}

.ic{display:inline-flex;width:24px;height:24px;flex:none}.ic svg{width:100%;height:100%}
.chip .ic{width:26px;height:26px;margin-left:-4px}
.card.coffee{padding:0;overflow:hidden}

.nline{display:block}.tags{display:flex;gap:6px;flex-wrap:wrap}.tags:empty{display:none}
.tagc{margin-left:0}
.tagg{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--accent);color:var(--accent);border-radius:8px;padding:0 6px;font-size:13px;font-weight:700}

.chev{font-size:26px;color:var(--text2);transition:transform .15s;display:inline-block;transform:rotate(90deg)}
.chev.up{transform:rotate(-90deg)}
.srow .chev,.wizpad .chev{transform:none}
.cbody{padding:0 12px 12px;border-top:1px solid var(--line)}
.rview{margin:4px 0 10px}
button.wide{width:100%;justify-content:center;min-height:56px;margin:4px 0}
button.star{font-size:24px;width:56px}
.cacts{display:grid;grid-template-columns:1fr 1fr 56px;gap:8px;margin:6px 0}.cacts>*{justify-content:center;padding:0 8px;font-size:15px;text-align:center}button.star.on{border-color:var(--accent);color:var(--accent)}
.bhead,.brow{display:grid;grid-template-columns:minmax(78px,1.1fr) 1fr 1.1fr 22px;gap:8px;align-items:center}
.bhead{color:var(--text3);font-size:13px;padding:6px 12px 0}
.basket{padding:0;margin:6px 0;overflow:hidden}
.fbasket{padding:0 12px 4px}.fbasket .bar{gap:8px;flex-wrap:nowrap}.fbasket .fbody{display:none}.fbasket.open .fbody{display:grid;padding-bottom:8px}
.bhd{flex:1;min-width:0;min-height:56px;justify-content:flex-start;gap:10px;border:none;background:none;padding:0 4px;text-align:left}
.bhd .chev{transition:transform .15s;transform:none;display:inline-block;width:12px}.fbasket.open .bhd .chev{transform:rotate(90deg)}
.bhd .bsum{color:var(--text3);font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fbasket.open .bsum{display:none}
.basket .kv{padding:0 12px 10px;margin:0}.basket .hint{padding:0 12px 10px;margin:0}
.brow{width:100%;text-align:left;border:none;background:none;border-radius:0;min-height:56px;padding:6px 12px;font-variant-numeric:tabular-nums}
.bname{font-weight:600;display:flex;align-items:center;gap:6px}.bname .rect{margin-left:0}
.tagn{display:inline-block;border:2px solid var(--new);color:var(--new);border-radius:7px;padding:0 5px;font-size:12px;font-weight:700;margin-left:6px}
.step{display:grid;grid-template-columns:1fr;gap:2px}
.sname{font-weight:600}
.scols{display:grid;grid-template-columns:10.5em 1fr;gap:2px 14px;align-items:baseline;font-variant-numeric:tabular-nums}

@media (max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
/* Wizard „Fürs nächste Mal anpassen“ (wie am Panel, Entwurf 50_…) */
:root{--sug:#e2c45e}
.wd svg{width:100%;height:100%;display:block;overflow:visible}
.wd .wz-fig{transform-box:view-box;transform-origin:24px 45px}
.wd .wz-arm{transform-box:view-box;transform-origin:31.6px 29.2px}
.wd .wz-star{transform-box:view-box;transform-origin:24.5px 11.2px;opacity:.7}
.wd.go{--n:2}.wd.go1{--n:1}
.wd.go .wz-fig,.wd.go1 .wz-fig{animation:wzFig 2.4s ease-in-out var(--n)}
.wd.go .wz-arm,.wd.go1 .wz-arm{animation:wzArm 2.4s ease-in-out var(--n)}
.wd.go .wz-star,.wd.go1 .wz-star{animation:wzStar 2.4s ease-in-out var(--n)}
.wd.go .wz-crys,.wd.go1 .wz-crys{animation:wzCrys 2.4s ease-in-out var(--n)}
@keyframes wzFig{0%{transform:translateY(0) rotate(0)}12%{transform:translateY(-1px) rotate(-7deg)}25%{transform:translateY(-2.2px) rotate(0)}37%{transform:translateY(-1px) rotate(7deg)}50%{transform:translateY(0) rotate(0)}62%{transform:translateY(-.6px) rotate(-4deg)}75%{transform:translateY(-1.6px) rotate(0)}87%{transform:translateY(-.6px) rotate(4deg)}100%{transform:translateY(0) rotate(0)}}
@keyframes wzArm{0%{transform:rotate(0)}18%{transform:rotate(-115deg)}28%{transform:rotate(-90deg)}38%{transform:rotate(-120deg)}55%{transform:rotate(0)}72%{transform:rotate(-60deg)}88%,100%{transform:rotate(0)}}
@keyframes wzStar{0%,100%{transform:rotate(0) scale(1);opacity:.7}50%{transform:rotate(36deg) scale(1.35);opacity:1}}
@keyframes wzCrys{0%,100%{color:var(--accent)}50%{color:var(--sug)}}
@media (prefers-reduced-motion:reduce){.wd .wz-fig,.wd .wz-arm,.wd .wz-star,.wd .wz-crys{animation:none!important}}
.wizpad{width:100%;min-height:84px;text-align:left;gap:14px;padding:10px 14px;margin:8px 0 4px;border-radius:14px;background:var(--card)}

.splash{position:fixed;inset:0;background:var(--bg);z-index:30;overflow:hidden}
.splash .stage{position:absolute;left:50%;top:50%;width:390px;height:640px;transform-origin:center}
.splash .lay{position:absolute;inset:0;pointer-events:none}
.splash .sground{position:absolute;left:45px;top:380px;width:300px;height:2px;background:linear-gradient(90deg,transparent,var(--line),transparent)}
.splash .swiz{position:absolute;left:111px;top:212px;width:168px;height:168px;overflow:visible}
.splash .sbean{position:absolute;left:0;top:0;width:48px;height:32px;transform-origin:24px 16px}.splash .sbean svg{width:48px;height:32px;display:block}
.splash .slogo{position:absolute;left:50%;top:430px;font-size:46px;font-weight:800;letter-spacing:-.5px;white-space:nowrap;transform:translateX(-50%)}
.splash .slogo span{color:var(--accent)}
.splash .sstatus{position:absolute;left:0;right:0;top:505px;text-align:center;color:var(--new);font-size:15px}.splash .sstatus.warn{color:var(--err);padding:0 20px}
.splash .sver{position:absolute;right:16px;bottom:14px;color:var(--text3);font-size:13px}

.bkperm span{flex:1;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 18px;z-index:9;transition:opacity .25s,transform .25s;box-shadow:0 4px 14px rgba(0,0,0,.45)}
.toast.on{opacity:1;transform:translate(-50%,0)}

function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v===false||v==null)continue;
    if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else if(k==='html')e.innerHTML=v;else e.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)){if(c==null||c===false)continue;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);}
  return e;
}

const HD=512,HD_MAX=150*1024;   // große Bildfassung (coffee_image.h: kCoffeePhotoMaxBytes)
function photoUrl(b64){return 'data:'+(b64.startsWith('UklGR')?'image/webp':'image/jpeg')+';base64,'+b64;}
function drawDevice(canvas,b64){
  const bin=atob(b64);const ctx=canvas.getContext('2d');canvas.width=canvas.height=SIZE;
  const img=ctx.createImageData(SIZE,SIZE);
  for(let i=0;i<SIZE*SIZE;i++){const o=4+i*3;const c=(bin.charCodeAt(o)<<8)|bin.charCodeAt(o+1);
    img.data[i*4]=((c>>11)&31)*255/31;img.data[i*4+1]=((c>>5)&63)*255/63;img.data[i*4+2]=(c&31)*255/31;img.data[i*4+3]=bin.charCodeAt(o+2);}
  ctx.putImageData(img,0,0);
}
// Foto -> 64 × 64 (gleiche Schritte wie tools/images/make_coffee_image.py)
function processPhoto(image){
  const max=1000,s0=Math.min(1,max/Math.max(image.naturalWidth,image.naturalHeight));
  const w0=Math.max(1,Math.round(image.naturalWidth*s0)),h0=Math.max(1,Math.round(image.naturalHeight*s0));
  const c0=document.createElement('canvas');c0.width=w0;c0.height=h0;const x0=c0.getContext('2d');
  x0.fillStyle='#fff';x0.fillRect(0,0,w0,h0);x0.drawImage(image,0,0,w0,h0);
  const d=x0.getImageData(0,0,w0,h0),p=d.data;let minX=w0,minY=h0,maxX=-1,maxY=-1;
  for(let y=0;y<h0;y++)for(let x=0;x<w0;x++){const i=(y*w0+x)*4,r=p[i],g=p[i+1],b=p[i+2];const lo=Math.min(r,g,b),hi=Math.max(r,g,b);
    if(lo>=215&&hi-lo<=14){p[i]=p[i+1]=p[i+2]=255;continue;}
    if(0.299*(255-r)+0.587*(255-g)+0.114*(255-b)>24){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}
  x0.putImageData(d,0,0);if(maxX<0){minX=0;minY=0;maxX=w0-1;maxY=h0-1;}
  const sw=maxX-minX+1,sh=maxY-minY+1,big=SIZE*4,k=0.96*big/Math.hypot(sw,sh);
  const c1=document.createElement('canvas');c1.width=c1.height=big;const x1=c1.getContext('2d');
  x1.fillStyle='#fff';x1.fillRect(0,0,big,big);x1.imageSmoothingQuality='high';
  const w=sw*k,hh=sh*k;x1.drawImage(c0,minX,minY,sw,sh,(big-w)/2,(big-hh)/2,w,hh);
  // große Fassung für den Browser (JPEG, 512 × 512, gleicher Ausschnitt; rund erst per CSS)
  const c3=document.createElement('canvas');c3.width=c3.height=HD;const x3=c3.getContext('2d');
  x3.fillStyle='#fff';x3.fillRect(0,0,HD,HD);x3.imageSmoothingQuality='high';
  const k3=0.96*HD/Math.hypot(sw,sh);x3.drawImage(c0,minX,minY,sw,sh,(HD-sw*k3)/2,(HD-sh*k3)/2,sw*k3,sh*k3);
  let hd='';for(const q of [0.85,0.7,0.55]){hd=c3.toDataURL('image/jpeg',q).split(',')[1]||'';if(hd.length*3/4<=HD_MAX)break;}
  const c2=document.createElement('canvas');c2.width=c2.height=SIZE;const x2=c2.getContext('2d');
  x2.imageSmoothingQuality='high';x2.drawImage(c1,0,0,SIZE,SIZE);const out=x2.getImageData(0,0,SIZE,SIZE);
  for(let y=0;y<SIZE;y++)for(let x=0;x<SIZE;x++){let n=0;
    for(let sy=0;sy<4;sy++)for(let sx=0;sx<4;sx++){const dx=x+(sx+.5)/4-SIZE/2,dy=y+(sy+.5)/4-SIZE/2;if(dx*dx+dy*dy<=SIZE*SIZE/4)n++;}
    out.data[(y*SIZE+x)*4+3]=Math.round(n*255/16);}
  out.hd=hd.length*3/4<=HD_MAX?hd:'';out.hdCanvas=c3;
  return out;
}
function encodeImage(img){
  const hd=5|(SIZE<<10)|(SIZE<<21);let s=String.fromCharCode(hd&255,(hd>>8)&255,(hd>>16)&255,(hd>>>24)&255);
  for(let i=0;i<SIZE*SIZE;i++){const r=img.data[i*4],g=img.data[i*4+1],b=img.data[i*4+2],a=img.data[i*4+3];
    const c=((r>>3)<<11)|((g>>2)<<5)|(b>>3);s+=String.fromCharCode(c>>8,c&255,a);}
  return btoa(s);
}

      (!q||fold([c.name,c.manufacturer,c.origin].join(' ')).includes(q)));
    listEl.replaceChildren(!all.length?h('p',{class:'hint'},t('web.NO_COFFEES'))
      :shown.length?shown.map(card):[h('p',{class:'hint'},t('list.NO_MATCH')),h('button',{type:'button',onclick:reset},t('list.BTN_RESET_FILTER'))]);
  };
  search.oninput=()=>{listFilter.q=search.value;render();};

// Werte eines Rezepts kompakt wie am Panel: GO Time mit Korbzeilen (Korb · Mahlgrad ·
// Menge, antippen zeigt die Zeiten), Filter mit Schritten in festen Spalten
function recipeView(c,rec,diff,redraw){
  const cur=rec.current,prev=rec.previous||null,k=(f,b,s)=>kindOf(diff,f,b,s);
  const out=[];
  // Gelber Vorschlag am betroffenen Wert: Pfeil (Richtung der Zahl) und neuer Wert, antippbar
  const sg=diff&&diff.suggestion||null;
  const mk=(f,b,arrowOnly)=>{
    if(!sg||sg.field!==f||(f!=='temp'&&(sg.basket||null)!==(b||null)))return null;
    const open=e=>{e.stopPropagation();e.preventDefault();openSuggestion(c,rec,sg);};
    return h('span',{class:'sugv',role:'button',tabindex:'0','aria-label':t('wizard.SUG_ARIA',sg.label+' '+sg.to),onclick:open,
      onkeydown:e=>{if(e.key==='Enter'||e.key===' ')open(e);}},h('span',{'aria-hidden':'true'},sg.up?'↑':'↓'),arrowOnly?null:sg.to);
  };
  const timeSug=b=>sg&&['preinfusion','wait','shot'].includes(sg.field)&&sg.basket===b;
  if(diff&&diff.method_changed)out.push(kv([[t('LABEL_METHOD'),cmp(methodName(cur.method),methodName(prev.method),'changed')]]));
  if(k('recipe_name')!=='unchanged')out.push(kv([[t('LABEL_RECIPE_NAME'),cmp(cur.name,prev?prev.name:'',k('recipe_name'))]]));
  if(diff&&diff.freshness)out.push(h('div',{class:'wzinfo'},h('span',{class:'tg'},t('wizard.HINT_ROAST_DATE')),h('span',{},diff.freshness)));
  if(cur.method==='go_time'){
    const g=cur.go_time,pg=prev?prev.go_time:null,recB=g.recommended_basket;
    // Nur Siebe und Werte aus der Ausstattung (W5a); ausgeblendete bleiben gespeichert
    const order=['small','medium','large'].filter(basketOn).sort((a,b)=>(b===recB)-(a===recB));
    if(PROFILE.temp==='c')out.push(kv([[t('LABEL_WATER_TEMP'),[cmp(temp(g.water_temp_c),temp(pg&&pg.water_temp_c),k('go_time_water_temp')),mk('temp')]]]));
    const shotLabel=PROFILE.shot_end==='volume'?t('profile.LABEL_SHOT_GUIDE'):t('LABEL_SHOT');
    const timeFields=[PROFILE.preinfusion?'basket_preinfusion':null,PROFILE.wait?'basket_wait':null,'basket_shot','basket_yield'].filter(Boolean);
    out.push(h('div',{class:'bhead'},h('span',{},t('list.COL_BASKET')),h('span',{},t('list.COL_GRIND')),h('span',{},t('list.COL_DOSE')),h('span')));
    for(const b of order){
      const bd=g.baskets[b]||{},pb=pg?pg.baskets[b]||{}:{};
      const open=listState.baskets.has(b);
      const hidden=timeFields.filter(f=>k(f,b)!=='unchanged').length;
      const row=(label,f,fmtFn,key,sf)=>[label,[cmp(fmtFn(bd[key]),fmtFn(pb[key]),k(f,b)),sf?mk(sf,b):null]];
      const empty=['grind','dose_g','preinfusion_s','wait_s','shot_s','yield_g'].every(x=>bd[x]==null);
      out.push(h('div',{class:'basket'+(b===recB?' rec':'')},
        h('button',{type:'button',class:'brow','aria-expanded':open?'true':'false',onclick:()=>{open?listState.baskets.delete(b):listState.baskets.add(b);redraw();}},
          h('span',{class:'bname'},basketName(b),b===recB?h('span',{class:'rect',title:t('RECOMMENDED')},t('RECOMMENDED_SHORT')):null),
          h('span',{},cmp(grind(bd.grind),grind(pb.grind),k('basket_grind',b)),mk('grind',b)),
          h('span',{},cmp(dose(bd.dose_g),dose(pb.dose_g),k('basket_dose',b)),mk('dose',b),!open&&hidden?h('span',{class:'tagn'},hidden):null,!open&&timeSug(b)?mk(sg.field,b,true):null),
          h('span',{class:'chev'+(open?' up':''),'aria-hidden':'true'},'›')),
        open?(empty?h('p',{class:'hint'},t('NO_DATA')):kv([PROFILE.preinfusion?row(t('LABEL_PREINFUSION'),'basket_preinfusion',secs,'preinfusion_s','preinfusion'):null,
            PROFILE.wait?row(t('LABEL_WAIT'),'basket_wait',secs,'wait_s','wait'):null,
            row(shotLabel,'basket_shot',secs,'shot_s','shot'),row(t('LABEL_YIELD'),'basket_yield',dose,'yield_g')])):null));
    }
    if(k('recommended')!=='unchanged')out.push(kv([[t('RECOMMENDED'),cmp(recB?basketName(recB):t('EMPTY_VALUE'),pg&&pg.recommended_basket?basketName(pg.recommended_basket):t('EMPTY_VALUE'),k('recommended'))]]));
  }else{
    const f=cur.filter,pf=prev?prev.filter:{steps:[]};
    out.push(kv([PROFILE.kettle_temp?[t('LABEL_WATER_TEMP'),[cmp(temp(f.water_temp_c),temp(pf.water_temp_c),k('filter_water_temp')),mk('temp')]]:null,
                 [t('LABEL_GRIND'),[cmp(grind(f.grind),grind(pf.grind),k('filter_grind')),mk('grind')]],
                 [t('LABEL_DOSE'),[cmp(dose(f.dose_g),dose(pf.dose_g),k('filter_dose')),mk('dose')]]]));
    if(f.steps.length)out.push(h('h3',{},t('LABEL_STEPS')));
    const counts={};
    f.steps.forEach((s,i)=>{
      counts[s.type]=(counts[s.type]||0)+1;
      const sd=diff?diff.steps.find(x=>x.id===s.id):null;const ps=(pf.steps||[]).find(x=>x.id===s.id)||{};
      const same=f.steps.filter(x=>x.type===s.type).length>1;
      const title=same?t('STEP_NUMBERED',stepName(s.type),counts[s.type]):stepName(s.type);
      const kk=x=>sd&&sd.k==='changed'?sd[x]:'unchanged';
      const scale=PROFILE.filter_scale&&diff&&diff.scale&&diff.scale[i]!=null?t('SCALE_TARGET',diff.scale[i]):'';
      const start=diff&&diff.start&&diff.start[i]!=null?t('STEP_START',minsec(diff.start[i])):'';
      out.push(h('div',{class:'step'+(sd&&sd.k==='added'?' added':'')},
        h('div',{class:'sname'},kk('type')==='changed'?cmp(title,stepName(ps.type),'changed'):title,
          sd&&sd.k==='added'?h('span',{class:'t-new'},t('CMP_NEW')):null,
          sd&&sd.prev?h('span',{class:'hint'},' · '+t('CMP_PREVIOUS_STEP',sd.prev)):null),
        s.type!=='wet_filter'?h('div',{class:'scols'},
          h('b',{},cmp(unit(s.water_g,t('UNIT_GRAM')),unit(ps.water_g,t('UNIT_GRAM')),kk('water'))),h('span',{class:'thin'},scale),
          h('b',{},s.wait_s!=null||kk('wait')!=='unchanged'?cmp(minsec(s.wait_s),minsec(ps.wait_s),kk('wait')):''),h('span',{class:'thin'},start)):null));
    });
    if(diff&&diff.removed.length){
      out.push(h('h3',{},t('CMP_REMOVED_STEPS')));
      for(const r of diff.removed){const ps=(pf.steps||[]).find(x=>x.id===r.id);if(ps)out.push(h('div',{class:'step'},h('s',{},stepName(ps.type)+(ps.water_g!=null?' · '+ps.water_g+' '+t('UNIT_GRAM'):''))));}
    }
  }
  if(cur.notes||k('notes')!=='unchanged')out.push(kv([[t('LABEL_NOTES'),cmp(cur.notes,prev?prev.notes:'',k('notes'))]]));
  if(rec.comment)out.push(kv([[t('LABEL_COMMENT'),rec.comment]]));
  return h('div',{class:'rview'},out);
}

// Fenster über der Seite; Esc bzw. Tipp daneben schließt wie „Später“/✕

const openDialogs=new Set();
function dialog(labelId,...kids){
  const ov=h('div',{class:'overlay',onclick:e=>{if(e.target===ov)close();}},h('div',{class:'dlg',role:'dialog','aria-modal':'true','aria-labelledby':labelId},kids));
  const key=e=>{if(e.key==='Escape')close();};
  function close(){document.removeEventListener('keydown',key);ov.remove();openDialogs.delete(close);}
  openDialogs.add(close);document.addEventListener('keydown',key);document.body.appendChild(ov);
  const f=ov.querySelector('button.primary')||ov.querySelector('button');if(f)f.focus();
  return close;
}

// Zahl aus der Eingabe: Komma wird zu Punkt, leer = null; NaN bei ungültiger Eingabe
function num(input,decimals){

// --- Sicherung in der Web-App (W4, Projektkontext 4c) -----------------------------
// Erinnerung beim Öffnen, „Jetzt sichern“ (iPhone: Teilen-Menü), automatische
// Sicherung in eine einmal gewählte Datei (File System Access API, Android/Chrome).
// Zähler und Einstellungen führt der Kern (/api/backup/*), den Datei-Zugriff
// (FileSystemFileHandle) merkt sich der Browser in einer eigenen IndexedDB.
const BACKUP_QUIET=['/api/backup/','/api/profile','/api/wizard/start','/api/wizard/evaluate','/api/wizard/preview','/api/import/check','/api/suggestion/preview'];
const BK={handle:null,needsPermission:false,timer:null,running:false};
const canAutoBackup=()=>APP&&typeof window.showSaveFilePicker==='function';
function kvStore(mode,fn){
  return new Promise(res=>{try{const o=indexedDB.open('coffeewiz-backup',1);
    o.onupgradeneeded=()=>o.result.createObjectStore('kv');
    o.onsuccess=()=>{try{const q=fn(o.result.transaction('kv',mode).objectStore('kv'));q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined);}};
    o.onerror=()=>res(undefined);}catch(e){res(undefined);}});
}
const kvGet=k=>kvStore('readonly',st=>st.get(k));
const kvSet=(k,v)=>kvStore('readwrite',st=>v===undefined?st.delete(k):st.put(v,k));
const exportName=()=>'coffeewiz-export-'+new Date().toISOString().slice(0,10)+'.json';
async function exportText(){return (await CoffeewizBridge.call('GET','/api/export')).body;}
async function permitted(ask){
  if(!BK.handle||!BK.handle.queryPermission)return false;
  const o={mode:'readwrite'};let p=await BK.handle.queryPermission(o);
  if(p!=='granted'&&ask)p=await BK.handle.requestPermission(o);
  return p==='granted';
}
async function writeBackupFile(text){const w=await BK.handle.createWritable();await w.write(text);await w.close();}
// Manuell: text vorher holen, damit das Teilen-Menü noch als Reaktion auf den Tipp gilt
async function backupNow(text){
  text=text||await exportText();
  try{
    if(BK.handle&&await permitted(true)){await writeBackupFile(text);BK.needsPermission=false;}
    else{
      const file=new File([text],exportName(),{type:'application/json'});
      if(!canAutoBackup()&&navigator.canShare&&navigator.canShare({files:[file]}))await navigator.share({files:[file],title:t('APP_NAME')});
      else downloadText(text,exportName());
    }
  }catch(e){if(e&&e.name==='AbortError')return false;console.error(e);toast(t('webapp.BACKUP_FAILED'));return false;}
  await api('POST','/api/backup/done',{mode:'manual'});
  toast(t('webapp.BACKUP_SAVED'));
  return true;
}
// Automatisch: kurz nach der letzten Änderung, nur mit erteilter Erlaubnis
function scheduleAutoBackup(){
  if(!BK.handle)return;
  clearTimeout(BK.timer);BK.timer=setTimeout(runAutoBackup,1500);
}
async function runAutoBackup(){
  if(!BK.handle||BK.running)return;
  BK.running=true;
  try{
    if(!await permitted(false)){BK.needsPermission=true;showPermissionBanner();return;}
    await writeBackupFile(await exportText());
    await api('POST','/api/backup/done',{mode:'auto'});
    toast(t('webapp.BACKUP_SAVED'));
  }catch(e){console.error(e);toast(t('webapp.BACKUP_FAILED'));}
  finally{BK.running=false;}
}

async function enableAutoBackup(){

    h('button',{type:'button',class:on===v?'on':'','aria-pressed':on===v?'true':'false',onclick:()=>set(v)},(on===v?'✓ ':'')+l)));
  const last=st.last_backup?t('webapp.BACKUP_LAST',new Date(st.last_backup*1000).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'})):t('webapp.BACKUP_NEVER');
  return h('div',{class:'card'},h('h3',{},t('webapp.BACKUP_SETTINGS_TITLE')),h('p',{},last),
    h('button',{type:'button',class:'primary',onclick:async()=>{if(await backupNow())rerender();}},'⬇ '+t('webapp.BACKUP_BTN_NOW')),
    !canAutoBackup()&&navigator.canShare?h('p',{class:'hint'},t('webapp.BACKUP_SHARE_HINT')):null,
    canAutoBackup()?[h('label',{class:'f'},t('webapp.BACKUP_AUTO')),
      seg(!!BK.handle,async v=>{if(v)await enableAutoBackup();else await disableAutoBackup();rerender();}),
      h('p',{class:'hint'},t('webapp.BACKUP_AUTO_HINT')),
      BK.handle?h('p',{class:'hint'},t('webapp.BACKUP_AUTO_FILE',BK.handle.name)):null,
      BK.needsPermission?h('button',{type:'button',onclick:async()=>{if(await permitted(true)){BK.needsPermission=false;await runAutoBackup();rerender();}}},t('webapp.BACKUP_BTN_ALLOW')):null]:null,
    BK.handle?null:[h('label',{class:'f'},t('webapp.BACKUP_REMINDER')),
      seg(!st.reminder_off,async v=>{await api('POST','/api/backup/settings',{reminder_off:!v});rerender();}),
      h('p',{class:'hint'},t('webapp.BACKUP_REMINDER_HINT'))]);
}

// --- Sichern ---------------------------------------------------------------------
function downloadText(text,name){
  const url=URL.createObjectURL(new Blob([text],{type:'application/json'}));
  const a=h('a',{href:url,download:name});document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),10000);
}
async function showBackup(){
  const today=new Date().toISOString().slice(0,10);
  const st=APP?await api('GET','/api/backup/status'):null;
  const out=h('div'),bar=h('div',{class:'progress'},h('div')),file=h('input',{type:'file',accept:'.json,application/json'});
  const setBar=(i,n)=>{bar.firstChild.style.width=(n?100*i/n:0)+'%';};
  file.onchange=async()=>{
    const f=file.files[0];file.value='';if(!f)return;
    out.replaceChildren(bar);setBar(0,1);
    let doc;try{doc=JSON.parse(await f.text());}catch(e){doc=null;}
    if(!doc||doc.format!=='coffeewiz-export'||!Array.isArray(doc.coffees)){out.replaceChildren(message(t('web.IMPORT_BAD_FILE'),'err'));return;}
    const n=doc.coffees.length,checks=[],status=h('div',{class:'hint'});out.append(status);
    for(let i=0;i<n;i++){status.textContent=t('web.IMPORT_CHECKING',i+1,n);setBar(i+1,n);
      const r=await api('POST','/api/import/check',JSON.stringify(doc.coffees[i].coffee));checks.push(r.ok?r.data:{valid:false});}
    const bad=checks.map((c,i)=>c.valid?null:((doc.coffees[i].coffee||{}).name||'#'+(i+1))).filter(Boolean);
    if(bad.length){out.replaceChildren(message(t('web.IMPORT_INVALID'),'err'),h('ul',{},bad.map(b=>h('li',{},b))));return;}
    const existing=checks.filter(c=>c.conflict).map(c=>c.name+(c.manufacturer?' · '+c.manufacturer:''));
    let mode='skip';
    const modes=h('div',{class:'seg'});
    const renderModes=()=>modes.replaceChildren(...[['skip',t('web.MODE_SKIP')],['overwrite',t('web.MODE_OVERWRITE')],['new',t('web.MODE_NEW')]]
      .map(([v,l])=>h('button',{type:'button',class:mode===v?'on':'',onclick:()=>{mode=v;renderModes();}},l)));
    renderModes();
    const scaleNote=doc.grind_scale&&doc.grind_scale!==(PROFILE.grind_scale||'king_size_dial')?message(t('web.IMPORT_OTHER_SCALE',String(doc.grind_scale)),'warn'):null;
    out.replaceChildren(message(t('web.IMPORT_SUMMARY',n,existing.length)),scaleNote,
      existing.length?[h('div',{class:'hint'},t('web.IMPORT_EXISTING')),h('ul',{},existing.map(e=>h('li',{},e))),modes]:null,
      h('div',{class:'bar'},h('button',{class:'primary',onclick:async()=>{
        const res={created:0,overwritten:0,skipped:0},failed=[],badImg=[],st=h('div',{class:'hint'});
        out.replaceChildren(bar,st);
        for(let i=0;i<n;i++){st.textContent=t('web.IMPORT_PROGRESS',i+1,n);setBar(i+1,n);
          const e=doc.coffees[i],body={coffee:e.coffee};if(e.image)body.image=e.image;if(e.photo)body.photo=e.photo;
          const r=await api('POST','/api/import',body,{mode});const d=r.data||{};
          if(res[d.outcome]!==undefined)res[d.outcome]++;else failed.push(e.coffee.name);
          if(d.image_invalid||d.photo_invalid)badImg.push(e.coffee.name);}
        out.replaceChildren(message(t('web.IMPORT_DONE',res.created,res.overwritten,res.skipped),'ok'),
          failed.length?message(t('web.IMPORT_FAILED',failed.join(', ')),'err'):null,badImg.length?message(t('web.IMPORT_IMAGE_BAD',badImg.join(', ')),'err'):null);
      }},t('web.BTN_IMPORT'))));
  };
  app.replaceChildren(h('div',{class:'bar'},h('button',{class:'ghost',onclick:()=>go('#/settings')},t('BTN_BACK'))),
    h('h2',{},t('web.BACKUP_TITLE')),
    st&&st.ok?backupSettingsCard(st.data,showBackup):null,
    h('div',{class:'card'},h('h3',{},t('web.EXPORT_TITLE')),h('p',{class:'hint'},t('web.EXPORT_HINT')),
      APP?h('button',{onclick:async()=>{const r=await CoffeewizBridge.call('GET','/api/export');
          downloadText(r.body,'coffeewiz-export-'+today+'.json');await api('POST','/api/backup/done',{mode:'download'});}},'⬇ '+t('web.BTN_EXPORT'))
        :h('a',{class:'btn primary',href:'/api/export',download:'coffeewiz-export-'+today+'.json'},'⬇ '+t('web.BTN_EXPORT'))),
    h('div',{class:'card'},h('h3',{},t('web.IMPORT_TITLE')),h('p',{class:'hint'},t('web.IMPORT_HINT')),
      h('label',{class:'btn'},'⬆ '+t('web.BTN_IMPORT_PICK'),file),out),
    APP?null:h('div',{class:'card'},h('h3',{},t('web.CRASH_TITLE')),h('p',{class:'hint'},t('web.CRASH_HINT')),
      h('a',{class:'btn',href:'/api/crashlog',download:'coffeewiz-absturzinfo-'+today+'.txt'},'⬇ '+t('web.BTN_CRASH'))));
}

// Eine Seite je Bereich; jede Antwort wird sofort gespeichert. Andere Mühlen-Skalen folgen mit W5b.
function pRadio(items,cur,set){
  return h('div',{class:'prad',role:'radiogroup'},items.map(([v,title,desc,dis])=>h('button',{type:'button',role:'radio','aria-checked':cur===v?'true':'false',
    class:'rad'+(cur===v?' on':''),disabled:!!dis,onclick:()=>set(v)},h('i',{'aria-hidden':'true'}),h('span',{},h('b',{},title),desc?h('small',{},desc):null))));
}
function pSeg(items,cur,set){
  return h('div',{class:'seg pseg'},items.map(([v,l])=>h('button',{type:'button',class:cur===v?'on':'','aria-pressed':cur===v?'true':'false',onclick:()=>set(v)},(cur===v?'✓ ':'')+l)));
}
const pYesNo=(cur,set)=>pSeg([[true,t('profile.YES')],[false,t('profile.NO')]],cur,set);
const pLabel=text=>h('label',{class:'f'},text);
const areaName=a=>t({methods:'profile.AREA_METHODS',machine:'profile.AREA_MACHINE',baskets:'profile.AREA_BASKETS',grinder:'profile.AREA_GRINDER',filter:'profile.AREA_FILTER',backup:'profile.AREA_BACKUP'}[a]);
// Bereiche in dieser Reihenfolge; Maschine und Siebe nur mit Siebträger, Filter nur mit Filter
function profileAreas(withBackup){
  return ['methods',PROFILE.go_time?'machine':null,PROFILE.go_time?'baskets':null,'grinder',PROFILE.filter?'filter':null,
    withBackup&&canAutoBackup()?'backup':null].filter(Boolean);
}
function areaSummary(a,bottomless){
  const P=PROFILE,j=x=>x.filter(Boolean).join(t('list.SEPARATOR'));
  if(a==='methods')return P.go_time&&P.filter?t('profile.SUM_BOTH',methodName('go_time')):t('profile.SUM_ONLY',methodName(P.go_time?'go_time':'filter'));
  if(a==='machine')return j([t({time:'profile.SHOT_TIME',volume:'profile.SHOT_VOLUME',manual:'profile.SHOT_MANUAL'}[P.shot_end]),
    P.preinfusion?t('profile.SUM_PREINF'):null,P.wait?t('profile.SUM_WAIT'):null,
    P.temp==='c'?t('profile.TEMP_C'):P.temp==='steps'?t('profile.TEMP_STEPS'):t('profile.SUM_NO_TEMP')]);
  if(a==='baskets')return j([['small','medium','large'].filter(basketOn).map(basketName).join(', '),
    bottomless?t('profile.BOTTOMLESS'):t('profile.SPOUTED'),P.pressurized?t('profile.SUM_PRESSURIZED'):null]);
  if(a==='grinder')return j([P.grind_scale==='number'?t('profile.SCALE_NUMBER'):P.grind_scale==='steps'?t('profile.SCALE_STEPS'):t('profile.SCALE_KING'),
    P.grind_scale!=='king_size_dial'?t('profile.SUM_RANGE',numText(P.grind_min),numText(P.grind_max)):null,
    P.grind_scale!=='king_size_dial'?t('profile.SUM_STEP',numText(P.grind_step)):null,
    t({scale:'profile.BW_SCALE',time:'profile.BW_TIME',manual:'profile.BW_MANUAL'}[P.by_weight])]);
  if(a==='filter')return j([P.filter_scale?t('profile.SUM_SCALE'):t('profile.SUM_NO_SCALE'),P.kettle_temp?t('profile.SUM_TEMP'):t('profile.SUM_NO_TEMP')]);
  return '';
}
// Inhalt eines Bereichs: {title, sub, body}; ctx.bottomless kommt aus /api/settings
function areaView(a,ctx,rerender,next){
  const P=PROFILE,set=async patch=>{await saveProfile(patch);rerender();};

      pRadio([['both',t('profile.M_BOTH'),t('profile.M_BOTH_D')],['go',t('profile.M_GO')],['filter',t('profile.M_FILTER')]],cur,
        v=>set({go_time:v!=='filter',filter:v!=='go'})),
      P.go_time?[pLabel(t('profile.Q_GO_NAME')),name,h('p',{class:'hint'},t('profile.GO_NAME_HINT'))]:null]};
  }
  if(a==='machine')return {title:t('profile.Q_MACHINE'),sub:t('profile.Q_MACHINE_SUB'),body:[
    pLabel(t('profile.Q_SHOT_END')),pRadio([['time',t('profile.SHOT_TIME'),t('profile.SHOT_TIME_D')],['volume',t('profile.SHOT_VOLUME'),t('profile.SHOT_VOLUME_D')],

    pLabel(t('profile.Q_PREINF')),pYesNo(P.preinfusion,v=>set({preinfusion:v})),
    pLabel(t('profile.Q_WAIT')),pYesNo(P.wait,v=>set({wait:v})),
    pLabel(t('profile.Q_TEMP')),pSeg([['c',t('profile.TEMP_C')],['steps',t('profile.TEMP_STEPS')],['none',t('profile.NO')]],P.temp,v=>set({temp:v}))]};
  if(a==='baskets'){
    const owned=['small','medium','large'].filter(basketOn);
    return {title:t('profile.Q_BASKETS'),sub:t('profile.Q_BASKETS_SUB'),body:[
      h('div',{class:'seg pseg'},['small','medium','large'].map(b=>{const on=basketOn(b),last=on&&owned.length===1;

      P.pressurized?h('p',{class:'hint'},t('profile.PRESSURIZED_HINT')):null,
      pLabel(t('profile.Q_PORTAFILTER')),pRadio([[false,t('profile.SPOUTED')],[true,t('profile.BOTTOMLESS'),t('profile.BOTTOMLESS_D')]],ctx.bottomless,
        async v=>{const r=await api('POST','/api/settings',{bottomless:v});if(r.ok)ctx.bottomless=!!r.data.bottomless;rerender();})]};
  }
  if(a==='grinder'){
    // Mühlen-Skala (W5b): von–bis, Schrittweite für Vorschläge, Richtung; jede Änderung sofort gespeichert
    const other=P.grind_scale!=='king_size_dial',err=h('div');
    const setG=async patch=>{if(!await saveProfile(patch)){err.replaceChildren(message(t('profile.GRIND_INVALID'),'err'));return false;}rerender();return true;};
    const numIn=(key,val)=>{const i=h('input',{type:'text',inputmode:'decimal',value:numText(val),autocomplete:'off',
      onchange:async()=>{const v=Number(i.value.trim().replace(',','.'));if(i.value.trim()===''||!isFinite(v)){err.replaceChildren(message(t('profile.GRIND_INVALID'),'err'));return;}
        i.value=numText(v);if(!await setG({[key]:v}))i.value=numText(P[key]);}});return i;};
    const pick=v=>{if(v===P.grind_scale)return;
      // Startwerte je Skala (Annahme): Zahlenskala 0–50 in 0.5, Stufen 1–40 in 1
      setG(v==='number'?{grind_scale:v,grind_min:0,grind_max:50,grind_step:.5}:v==='steps'?{grind_scale:v,grind_min:1,grind_max:40,grind_step:1}:{grind_scale:v});};
    return {title:t('profile.Q_GRINDER'),sub:t('profile.Q_GRINDER_SUB'),body:[
    pLabel(t('profile.LBL_SCALE')),pRadio([['king_size_dial',t('profile.SCALE_KING'),t('profile.SCALE_KING_D')],
      ['number',t('profile.SCALE_NUMBER'),t('profile.SCALE_NUMBER_D')],
      ['steps',t('profile.SCALE_STEPS'),t('profile.SCALE_STEPS_D')]],P.grind_scale,pick),
    other?[h('div',{class:'grid2'},h('div',{},pLabel(t('profile.LBL_FROM')),numIn('grind_min',P.grind_min)),h('div',{},pLabel(t('profile.LBL_TO')),numIn('grind_max',P.grind_max))),
      pLabel(t('profile.Q_STEP')),numIn('grind_step',P.grind_step),h('p',{class:'hint'},t('profile.STEP_HINT')),
      pLabel(t('profile.Q_FINER_SMALLER')),pYesNo(P.grind_finer_smaller,v=>setG({grind_finer_smaller:v})),
      h('p',{class:'hint'},t('profile.SCALE_CHANGED'))]:null,err,
    pLabel(t('profile.Q_BY_WEIGHT')),pSeg([['scale',t('profile.BW_SCALE')],['time',t('profile.BW_TIME')],['manual',t('profile.BW_MANUAL')]],P.by_weight,v=>set({by_weight:v}))]};
  }
  if(a==='filter')return {title:t('profile.Q_FILTER'),sub:'',body:[
    pLabel(t('profile.Q_FILTER_SCALE')),pYesNo(P.filter_scale,v=>set({filter_scale:v})),h('p',{class:'hint'},t('profile.FILTER_SCALE_HINT')),
    pLabel(t('profile.Q_KETTLE')),pYesNo(P.kettle_temp,v=>set({kettle_temp:v})),h('p',{class:'hint'},t('profile.KETTLE_HINT'))]};
  // Sicherung (nur mit Datei-Schnittstelle, also Android/Chrome)
  return {title:t('profile.Q_BACKUP'),sub:t('profile.Q_BACKUP_SUB'),body:[

      BK.handle?null:h('button',{type:'button',onclick:next},t('profile.BACKUP_NO')))]};
}
async function bottomlessCtx(){const r=await api('GET','/api/settings');return {bottomless:!!(r.ok&&r.data&&r.data.bottomless)};}
let setupStep=0;
async function showSetup(){
  const ctx=await bottomlessCtx();
  const finish=async()=>{await saveProfile({setup_done:true});setupStep=0;go('#/');};
  const render=()=>{
    const steps=profileAreas(true);setupStep=Math.max(0,Math.min(setupStep,steps.length-1));
    const a=steps[setupStep],last=setupStep===steps.length-1;
    const next=()=>{if(last)finish();else{setupStep++;render();window.scrollTo(0,0);}};
    const v=areaView(a,ctx,render,next);
    app.replaceChildren(h('div',{class:'setup'},
      h('div',{class:'row'},h('h1',{class:'grow'},t('profile.SETUP_TITLE')),h('button',{type:'button',class:'ghost',onclick:finish},t('profile.SETUP_SKIP'))),
      h('div',{class:'sstep'},t('profile.SETUP_STEP',setupStep+1,steps.length,areaName(a))),
      h('div',{class:'pbar','aria-hidden':'true'},h('i',{style:'width:'+Math.round(100*(setupStep+1)/steps.length)+'%'})),
      h('h2',{},v.title),v.sub?h('p',{class:'hint'},v.sub):null,v.body,
      a!=='backup'?h('div',{class:'phint'},'⚙ '+t('profile.SETUP_HINT')):null,
      h('div',{class:'sfoot'},h('button',{type:'button',disabled:setupStep===0,onclick:()=>{setupStep--;render();window.scrollTo(0,0);}},t('BTN_BACK')),
        h('button',{type:'button',class:'primary',onclick:next},last?t('profile.BTN_DONE'):t('profile.BTN_NEXT')))));
  };
  render();
}
async function showProfileAreas(){
  const ctx=await bottomlessCtx();
  app.replaceChildren(h('div',{class:'bar'},h('button',{class:'ghost',onclick:()=>go('#/settings')},t('BTN_BACK'))),
    h('h2',{},t('profile.SETTINGS_ROW')),
    h('div',{class:'rows'},profileAreas(false).map(a=>settingsRow(areaName(a),areaSummary(a,ctx.bottomless),()=>go('#/settings/profile/'+a))),
      settingsRow(t('profile.RESTART'),t('profile.RESTART_SUB'),async()=>{await saveProfile({setup_done:false});setupStep=0;go('#/setup');})),
    h('p',{class:'hint'},t('profile.HIDDEN_NOTE')));
}
async function showProfileArea(a){
  const ctx=await bottomlessCtx();
  const render=()=>{const v=areaView(a,ctx,render,()=>go('#/settings/profile'));
    app.replaceChildren(h('div',{class:'bar'},h('button',{class:'ghost',onclick:()=>go('#/settings/profile')},t('BTN_BACK'))),
      h('h2',{},v.title),v.sub?h('p',{class:'hint'},v.sub):null,v.body);};
  render();
}

// --- Navigation -------------------------------------------------------------------
function route(){
  const p=location.hash.replace(/^#/,'').split('/').filter(Boolean);
  // Liste und aufgeklappter Kaffee behalten ihre Lage, Formulare beginnen oben
  const listLike=!p[0]||(p[0]==='c'&&p[1]&&!['edit','new-recipe','r','starter'].includes(p[2]));
  if(!listLike)window.scrollTo(0,0);
  if(p[0]==='c'&&p[1]){
    if(p[2]==='edit')return showCoffeeForm(p[1]);
    if(p[2]==='new-recipe')return showRecipeForm(p[1],null,p[3]);
    if(p[2]==='starter')return showStarter();
    if(p[2]==='r'&&p[3]&&p[4]==='wizard')return showWizard(p[1],p[3]);
    if(p[2]==='r'&&p[3])return showRecipeForm(p[1],p[3]);
    return showList(p[1],p[2]);
  }
  if(p[0]==='new'&&p[1]==='starter')return showStarter();
  if(p[0]==='new'&&p[1]==='recipe')return showRecipeForm(null,null);
  if(p[0]==='new')return showCoffeeForm(null);
  if(p[0]==='backup')return showBackup();
  if(p[0]==='settings'&&p[1]==='portafilter')return showPortafilter();
  if(p[0]==='settings'&&p[1]==='profile'&&p[2])return showProfileArea(p[2]);
  if(p[0]==='settings'&&p[1]==='profile')return showProfileAreas();
  if(p[0]==='setup')return showSetup();
  if(p[0]==='settings')return showSettings();
  return showList(null);
}
window.addEventListener('hashchange',()=>{[...openDialogs].forEach(c=>c());route();});
async function start(){
  if(APP){
    // Speicher in IndexedDB; klappt das nicht (z. B. privater Modus), im Arbeitsspeicher mit Hinweis
    try{appInfo=await CoffeewizBridge.start();}
    catch(e){console.error(e);appInfo=await CoffeewizBridge.start({memoryOnly:true});}
  }
  const r=await api('GET','/api/texts');
  if(r.ok){T=r.data;document.title=t('APP_NAME');}
  await loadProfile();
  // Ersteinrichtung, solange sie weder abgeschlossen noch übersprungen ist (W5a)
  if(APP&&!PROFILE.setup_done&&!location.hash.startsWith('#/setup'))history.replaceState(null,'','#/setup');
  route();
  if(APP){const l=await api('GET','/api/coffees');const n=l.ok&&Array.isArray(l.data)?l.data.length:0;
    const ok=!appInfo||appInfo.persistent!==false;
    showSplash(ok?t(n===1?'splash.LOADED_ONE':'splash.LOADED',n):t('webapp.STORAGE_TEMP'),ok);}
  initBackup().catch(e=>console.error(e));
}
start().catch(e=>{console.error(e);app.replaceChildren(message('⚠ '+e,'err'));});
